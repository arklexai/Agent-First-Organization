name: "Display Coverage Comment"
description: "Display coverage comment using custom script"

inputs:
  github-token:
    description: "GitHub token for authentication"
    required: true
  minimum-green:
    description: "Minimum coverage percentage for green status"
    required: false
    default: "95.0"
  minimum-orange:
    description: "Minimum coverage percentage for orange status"
    required: false
    default: "85"

runs:
  using: "composite"
  steps:
    - name: Display coverage comment
      id: coverage
      shell: bash
      run: |
        python .github/scripts/post-coverage-comment.py
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COVERAGE_PATH: "coverage.xml"
        MINIMUM_GREEN: ${{ inputs.minimum-green }}
        MINIMUM_ORANGE: ${{ inputs.minimum-orange }}
