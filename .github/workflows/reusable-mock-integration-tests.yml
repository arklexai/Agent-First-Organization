name: Reusable Mock Integration Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.10'
    outputs:
      result:
        description: 'The result of the mock integration tests'
        value: ${{ jobs.test-mock-integration.outputs.result }}

jobs:
  test-mock-integration:
    name: Mock Integration Tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-api-key
      OPENAI_BASE_URL: http://localhost:5005

    outputs:
      result: ${{ job.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[strict-versions]' --quiet
          pip install uvicorn

      - name: Start OpenAI Mock Server
        run: |
          python integration_tests/utils/openai_mock_server.py &
          sleep 5

      - name: Test mock integration tests with pytest
        run: |
          pytest integration_tests/mock_tests/
