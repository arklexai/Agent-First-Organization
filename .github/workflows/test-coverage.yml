name: Test Coverage Check

on:
  pull_request:
    types: [labeled, opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run coverage on (optional)'
        required: false
        type: string

jobs:
  test:
    name: run tests and display coverage

    if: |
      (github.event_name == 'pull_request' && 
       github.base_ref == 'main' && 
       (github.event.label.name == 'run-coverage-tests' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write
      actions: read
      checks: write

    env:
      SHOPIFY_FIXED_ARGS: ${{ secrets.SHOPIFY_FIXED_ARGS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MIN_COVERAGE_THRESHOLD: '99.0'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[milvus,shopify,hubspot]' --quiet

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Run tests and check coverage threshold
        id: coverage-check
        run: |
          # Run tests with coverage database (required by py-cov-action)
          pytest tests/ --cov=arklex --cov-report=term-missing --cov-report=html --cov-report=xml --cov-report=json --no-cov-on-fail || true
          
          # Verify coverage files were created
          if [ ! -f ".coverage" ]; then
            echo "❌ Error: .coverage database was not generated"
            exit 1
          fi
          
          if [ ! -f "coverage.xml" ]; then
            echo "❌ Error: coverage.xml was not generated"
            exit 1
          fi

          python -c "
          import xml.etree.ElementTree as ET
          import os

          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib['line-rate']) * 100
              print(f'Coverage: {coverage:.1f}%')

              min_coverage = float(os.environ.get('MIN_COVERAGE_THRESHOLD', '99.0'))
              print(f'Minimum coverage threshold: {min_coverage}%')

              if coverage < min_coverage:
                  print(f'❌ Coverage ({coverage:.1f}%) is below minimum threshold ({min_coverage}%)')
                  exit(1)
              else:
                  print(f'✅ Coverage ({coverage:.1f}%) meets minimum threshold ({min_coverage}%)')

              with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
                  f.write(f'coverage={coverage:.1f}\\n')
          except Exception as e:
              print(f'Error reading coverage data: {e}')
              exit(1)
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/

      - name: Verify coverage files exist
        run: |
          if [ ! -f ".coverage" ]; then
            echo "❌ Error: .coverage database file not found"
            exit 1
          fi
          echo "✅ .coverage database file found"
          ls -la .coverage
          
          if [ ! -f "coverage.xml" ]; then
            echo "❌ Error: coverage.xml file not found"
            exit 1
          fi
          echo "✅ coverage.xml file found"
          ls -la coverage.xml

      - name: Validate coverage file
        run: |
          python .github/scripts/validate-coverage.py coverage.xml

      - name: Check GitHub access
        run: |
          echo "Checking GitHub API access..."
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.number }}" || {
            echo "❌ Error: Cannot access PR information"
            exit 1
          }
          echo "✅ GitHub API access confirmed"

      - name: Display coverage comment
        id: coverage
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 99.0
          MINIMUM_ORANGE: 70
          COVERAGE_PATH: ".coverage"
          VERBOSE: "true"
        continue-on-error: true

      - name: Fallback coverage comment
        if: failure() && steps.coverage.outcome == 'failure'
        run: |
          echo "Coverage comment action failed, creating manual comment..."
          COVERAGE=${{ steps.coverage-check.outputs.coverage }}
          
          # Create a simple coverage comment
          COMMENT="## 📊 Test Coverage Report
          
          **Coverage:** ${COVERAGE}%
          
          **Status:** $([ $(echo "$COVERAGE >= 99.0" | bc -l) -eq 1 ] && echo "✅ Excellent" || echo "⚠️ Needs improvement")
          
          Coverage report generated from test run."
          
          # Post comment using GitHub CLI or curl
          gh pr comment ${{ github.event.number }} --body "$COMMENT" || {
            echo "Failed to post comment via GitHub CLI, trying curl..."
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{\"body\":\"$COMMENT\"}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" || {
              echo "❌ Failed to post coverage comment"
              exit 1
            }
          }

      - name: Update README badge
        run: |
          COVERAGE=${{ steps.coverage-check.outputs.coverage }}

          COLOR=$(python -c "
          coverage = float('$COVERAGE')
          if coverage < 90:
              print('red')
          elif coverage < 99:
              print('orange')
          else:
              print('green')
          ")

          sed -i "s/coverage-[0-9]\+\.[0-9]%25-[a-z]*/coverage-${COVERAGE}%25-${COLOR}/g" README.md

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update README with ${COVERAGE}% test coverage"
            git push origin HEAD:${{ github.head_ref }}
          fi